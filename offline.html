<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>You're offline — Joel Flowstack</title>
<meta name="robots" content="noindex, nofollow" />
<!--
  Served by sw.js when a navigation fails while offline (replaces the
  browser's own dinosaur-game error page). Fully self-contained: inline
  CSS/JS, no external requests — it has to work with zero network.

  Uses the SAME tokens as css/global.css (obsidian/navy background, blue
  accent, hairline glass borders, mono labels, nav-style pill) so it
  reads as part of the site, not a separate theme.

  PERFORMANCE RULES (learned the hard way — see the notes in global.css):
  no backdrop-filter, no filter:blur, no shadowBlur and nothing animated
  that touches a blur. The panels are translucent fills + a hairline
  highlight over a static dark background (there's nothing behind them to
  blur anyway), and the canvas only repaints while the game is running.
-->
<style>
  :root {
    --black: #000; --white: #f5f5f4; --white-dim: #d8d8d6; --grey: #8a8c91; --grey-dim: #5c5e63;
    --line-soft: rgba(255,255,255,.08);
    --blue-glow: #3fa9e8; --blue-line: rgba(63,169,232,.28);
    --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; color: var(--white);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased;
    /* exact page background from global.css, plus two static glows (plain radial gradients, no blur filter) */
    background:
      radial-gradient(circle at 8% 4%, rgba(63,169,232,.16), transparent 42%),
      radial-gradient(circle at 96% 100%, rgba(63,169,232,.09), transparent 40%),
      radial-gradient(ellipse 120% 60% at 50% 0%, #0e1f38 0%, #060d1a 38%, #000 72%) fixed;
    touch-action: manipulation; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .wrap {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; align-items: center; gap: 12px;
    padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(18px + env(safe-area-inset-bottom, 0px));
  }

  /* Glass, site-style: barely-there fill, hairline edge, one faint top highlight. */
  .glass {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 18px 40px rgba(0,0,0,.35);
  }

  /* nav-style pill */
  .bar {
    width: min(880px, 100%); height: 56px; padding: 0 22px; border-radius: 999px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: rgba(8,9,14,.5);
  }
  .logo { font-family: var(--font-mono); font-size: .88rem; letter-spacing: .04em; white-space: nowrap; }
  .meta { display: flex; align-items: center; gap: 16px; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--grey); white-space: nowrap; }
  .meta b { color: var(--white); font-weight: 600; margin-left: 6px; letter-spacing: 0; }
  .net { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f87171; }
  .dot.ok { background: #34d399; box-shadow: 0 0 10px rgba(52,211,153,.8); }

  .card { width: min(520px, 100%); padding: 26px 28px 20px; border-radius: 22px; text-align: left; }
  .eyebrow { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--grey); margin-bottom: 10px; }
  .eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--grey-dim); }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 1.2rem + 2vw, 2.4rem); line-height: 1.1; letter-spacing: -.02em; margin: 0 0 10px; }
  .lede { margin: 0 0 16px; color: var(--grey); font-size: .95rem; line-height: 1.55; }
  .hint { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .06em; color: var(--grey-dim); margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  button#retry {
    pointer-events: auto; cursor: pointer; font-family: var(--font-mono); font-size: .76rem; letter-spacing: .06em; text-transform: uppercase;
    padding: 13px 24px; border-radius: 999px; color: #000; background: var(--white); border: 1px solid var(--white);
    transition: background .2s, transform .2s;
  }
  button#retry:hover { background: var(--white-dim); transform: translateY(-1px); }
  button#retry:active { transform: scale(.98); }
  .status { font-family: var(--font-mono); font-size: .72rem; color: var(--grey); min-height: 1.2em; }
  .status.ok { color: #34d399; }
  .contact { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-family: var(--font-mono); font-size: .7rem; color: var(--grey-dim); line-height: 1.7; }
  .contact b { color: var(--white-dim); font-weight: 500; }

  @media (max-width: 480px) { .bar { padding: 0 16px; } .meta .word { display: none; } .card { padding: 22px 20px 18px; } }
  @media (max-height: 520px) { .lede, .contact { display: none; } .card { padding: 16px 20px; } h1 { font-size: 1.3rem; margin-bottom: 6px; } .hint { margin-bottom: 10px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="wrap">
  <div class="bar glass">
    <div class="logo">JOEL<b>FLOW</b>STACK</div>
    <div class="meta">
      <span class="net"><span class="dot" id="dot"></span><span class="word" id="netlabel">Offline</span></span>
      <span>Score<b id="score">0</b></span>
      <span>Best<b id="best">0</b></span>
    </div>
  </div>
  <div class="card glass">
    <div class="eyebrow">Offline</div>
    <h1>You're offline.</h1>
    <p class="lede">No connection right now. Play while you wait — this page reloads by itself the moment you're back.</p>
    <div class="hint" id="hint">Space · ↑ · W · tap to jump</div>
    <div class="row">
      <button id="retry">Check connection</button>
      <div class="status" id="status" role="status" aria-live="polite">Waiting for connection…</div>
    </div>
    <div class="contact">Need me in the meantime? <b>joelflowstack@gmail.com</b> · Telegram <b>@joelflowstack</b></div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const hintEl = document.getElementById("hint");
  const retryBtn = document.getElementById("retry");
  const statusEl = document.getElementById("status");
  const dotEl = document.getElementById("dot");
  const netEl = document.getElementById("netlabel");
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Game units: cube = BASE units; constants are per fixed 1/60s step, so the
  // game runs the same on 60/120/144Hz displays.
  const BASE = 22, GRAVITY = 0.9, JUMP_V = -13, STEP = 1000 / 60;

  let best = 0;
  try { best = parseInt(localStorage.getItem("offlineRunnerBest") || "0", 10) || 0; } catch {}
  bestEl.textContent = best;

  let state = "idle"; // idle | playing | paused | over
  let player = null, obstacles = [], speed = 5, score = 0, frame = 0, dirty = true;
  let W = 0, H = 0, dpr = 1, k = 1, Wu = 0, Hu = 0, groundU = 0;

  function layout() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    const u = Math.max(26, Math.min(64, Math.min(H / 16, W / 15)));
    k = u / BASE; Wu = W / k; Hu = H / k;
    groundU = Hu * 0.56;
    ctx.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
    if (player && !player.jumping) player.y = groundU - player.h;
    dirty = true;
  }
  const playerX = () => Math.max(60, Wu * 0.14);

  function reset() {
    player = { w: BASE, h: BASE, y: groundU - BASE, vy: 0, jumping: false };
    obstacles = []; speed = 5; score = 0; frame = 0; dirty = true;
    scoreEl.textContent = "0";
  }
  layout(); reset();
  window.addEventListener("resize", layout);

  function setHint(text, visible) { hintEl.textContent = text; hintEl.style.visibility = visible ? "visible" : "hidden"; }

  function jump() {
    if (state === "paused") { state = "playing"; setHint("", false); return; }
    if (state === "idle") { state = "playing"; setHint("", false); }
    if (state === "over") { reset(); state = "playing"; setHint("", false); return; }
    if (!player.jumping) { player.vy = JUMP_V; player.jumping = true; }
  }
  window.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.code === "Space" || e.key === " " || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); jump(); }
  });
  window.addEventListener("pointerdown", (e) => { if (e.target === retryBtn) return; jump(); });
  retryBtn.addEventListener("click", () => checkConnection(true));

  function spawnObstacle() { obstacles.push({ x: Wu + 10, w: 14 + Math.random() * 10, h: 16 + Math.random() * 22 }); }

  function update() {
    frame++;
    if (frame % Math.max(35, 70 - Math.floor(speed * 2)) === 0) spawnObstacle();
    player.vy += GRAVITY; player.y += player.vy;
    if (player.y >= groundU - player.h) { player.y = groundU - player.h; player.vy = 0; player.jumping = false; }
    obstacles.forEach(o => o.x -= speed);
    while (obstacles.length && obstacles[0].x + obstacles[0].w < 0) obstacles.shift();
    const px = playerX();
    for (const o of obstacles) {
      const oy = groundU - o.h;
      if (px < o.x + o.w && px + player.w > o.x && player.y < oy + o.h && player.y + player.h > oy) {
        state = "over";
        const shown = Math.floor(score / 5);
        if (shown > best) { best = shown; try { localStorage.setItem("offlineRunnerBest", String(best)); } catch {} bestEl.textContent = best; }
        setHint("Space · ↑ · W · tap to try again", true);
        return;
      }
    }
    score += 1;
    scoreEl.textContent = Math.floor(score / 5);
    speed = 5 + score / 500;
  }

  function rr(x, y, w, h, r) { // rounded-rect path (roundRect() missing in older Safari)
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Flat, cheap drawing: solid fills and strokes only — no shadowBlur, no
  // per-frame gradients. The player echoes the site's obsidian cube: a dark
  // glass tile with a blue edge and an inner face line.
  function draw() {
    ctx.clearRect(0, 0, Wu, Hu);
    ctx.lineWidth = 1 / k;
    ctx.strokeStyle = "rgba(255,255,255,.14)";
    ctx.beginPath(); ctx.moveTo(0, groundU); ctx.lineTo(Wu, groundU); ctx.stroke();

    ctx.save();
    ctx.translate(playerX() + player.w / 2, player.y + player.h / 2);
    if (player.jumping && !reduceMotion) ctx.rotate(Math.min(0.5, Math.abs(player.vy) * 0.03) * Math.sign(player.vy));
    const hw = player.w / 2, hh = player.h / 2;
    ctx.fillStyle = "rgba(63,169,232,.10)"; rr(-hw - 3, -hh - 3, player.w + 6, player.h + 6, 7); ctx.fill(); // cheap faux-glow
    ctx.fillStyle = "rgba(10,10,11,.85)"; rr(-hw, -hh, player.w, player.h, 4); ctx.fill();
    ctx.strokeStyle = "#3fa9e8"; ctx.lineWidth = 1.5 / k; rr(-hw, -hh, player.w, player.h, 4); ctx.stroke();
    ctx.strokeStyle = "rgba(63,169,232,.4)"; ctx.lineWidth = 1 / k; rr(-hw + 5, -hh + 5, player.w - 10, player.h - 10, 2); ctx.stroke();
    ctx.restore();

    ctx.lineWidth = 1.25 / k;
    obstacles.forEach(o => {
      const y = groundU - o.h;
      ctx.fillStyle = "rgba(224,90,90,.14)"; rr(o.x, y, o.w, o.h, 3); ctx.fill();
      ctx.strokeStyle = "#e05a5a"; rr(o.x, y, o.w, o.h, 3); ctx.stroke();
    });
  }

  // Fixed-timestep loop. Repaints ONLY while playing or after a state/size
  // change — an idle or game-over screen costs nothing.
  let last = performance.now(), acc = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    let dt = now - last; last = now;
    if (dt > 250) dt = STEP;
    if (state === "playing") {
      acc += dt; let n = 0;
      while (acc >= STEP && n < 5 && state === "playing") { update(); acc -= STEP; n++; }
      if (n === 5) acc = 0;
      draw(); dirty = true;
    } else {
      acc = 0;
      if (dirty) { draw(); dirty = false; }
    }
  }
  requestAnimationFrame(loop);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === "playing") { state = "paused"; setHint("Paused — Space / tap to resume", true); }
  });

  // Reconnect detection: navigator.onLine only means "a network interface
  // exists", so confirm with a real no-store request before reloading.
  let checking = false;
  async function checkConnection(manual) {
    if (checking) return;
    checking = true;
    if (manual) { statusEl.className = "status"; statusEl.textContent = "Checking…"; }
    try {
      const res = await fetch("/robots.txt?ping=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("bad status");
      statusEl.className = "status ok"; statusEl.textContent = "Back online — reloading…";
      dotEl.classList.add("ok"); netEl.textContent = "Online";
      setTimeout(() => location.reload(), 700);
      return;
    } catch (_) {
      statusEl.className = "status";
      statusEl.textContent = manual ? "Still offline — reloading automatically when you're back." : "Waiting for connection…";
    }
    checking = false;
  }
  window.addEventListener("online", () => checkConnection(false));
  setInterval(() => { if (!document.hidden) checkConnection(false); }, 5000);
})();
</script>
</body>
</html>
